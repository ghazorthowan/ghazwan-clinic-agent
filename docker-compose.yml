services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic_dev_only
      POSTGRES_DB: clinic_booking
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clinic_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic_booking"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  clinic_pg_data:
