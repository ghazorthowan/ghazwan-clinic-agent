name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Security audit (fast, no DB needed) ───────────────────────────────
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        # --audit-level=high fails only on high/critical CVEs
        run: npm audit --audit-level=high

  # ── 2. Unit tests + typecheck + build (no DB needed) ────────────────────
  unit:
    name: Unit tests, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Build needs at least a placeholder — it won't run migrations
          DATABASE_URL: postgresql://clinic:clinic_dev_only@localhost:5432/clinic_booking
          STAFF_SESSION_SECRET: ci-build-secret-not-for-production

  # ── 3. Integration tests (real Postgres) ────────────────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic_dev_only
          POSTGRES_DB: clinic_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://clinic:clinic_dev_only@localhost:5432/clinic_booking
      STAFF_SESSION_SECRET: ci-session-secret-not-for-production-use
      ADMIN_EMAIL: admin@clinic.local
      ADMIN_PASSWORD: CIAdmin2026!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        # db:migrate runs all files in db/ — adding new migrations here is not needed
        run: npm run db:migrate

      - name: Seed admin account
        run: npm run db:seed-admin

      - name: Integration tests
        run: npm run test:integration
